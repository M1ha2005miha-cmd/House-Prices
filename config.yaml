data:
    train_path: data/train.csv
    test_path: data/test.csv
    submission_path: submission.csv

cv:
    n_splits: 5
    random_state: 42

models:
    ridge: {}
    xgboost:
        n_estimators: 1000
        learning_rate: 0.05
        max_depth: 3
        subsample: 0.8
        colsample_bytree: 0.8
    lightgbm: 
        n_estimators: 3000
        learning_rate: 0.01
        num_leaves: 7
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.4
        reg_lambda: 0
        verbose: -1
        min_child_samples: 3
    mlp:
        hidden_size: 128
        dropout: 0.3
        lr: 0.001
        weight_decay: 0.001
        epochs: 200

ensemble:
    models: [ridge, xgboost, mlp]