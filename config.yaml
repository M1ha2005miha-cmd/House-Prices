data:
    train_path: data/train.csv
    test_path: data/test.csv
    submission_path: submission.csv
    drop_features: []

cv:
    n_splits: 5
    random_state: 42
    stratified: false

preprocessing: 
    cat_encoder: onehot

models:
    ridge: {}
    linear: {}
    ridge_a10: {type: ridge, alpha: 10}
    ridge_a30: {type: ridge, alpha: 30}
    lasso_a0001: {type: lasso, alpha: 0.0001, max_iter: 10000}
    lasso_a0005: {type: lasso, alpha: 0.0005, max_iter: 10000}
    lasso_a001: {type: lasso, alpha: 0.001, max_iter: 10000}
    elasticnet: {alpha: 0.0005, l1_ratio: 0.5, max_iter: 10000}
    xgboost:
        n_estimators: 1000
        learning_rate: 0.05
        max_depth: 3
        subsample: 0.8
        colsample_bytree: 0.8
    lightgbm: 
        n_estimators: 3000
        learning_rate: 0.01
        num_leaves: 7
        subsample: 0.8
        subsample_freq: 1
        colsample_bytree: 0.4
        reg_lambda: 0
        verbose: -1
        min_child_samples: 3
    mlp:
        hidden_size: 128
        dropout: 0.3
        lr: 0.001
        weight_decay: 0.001
        epochs: 200

ensemble:
    models: [ridge, xgboost, mlp]
    n_folds: 5